<!DOCTYPE html>

<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet"><style>

<div style="min-height:100vh;padding:32px 20px 64px;box-sizing:border-box;font-family:'Nunito',sans-serif;color:#2a1f15;display:flex;flex-direction:column;gap:28px;max-width:1120px;margin:0 auto">

        <div style="position:absolute;left:18px;right:18px;top:294px;bottom:12px;display:flex;flex-direction:column;gap:3px"><span style="font-weight:900;font-size:17px;line-height:1.3">Loadout Tactician</span><span style="font-weight:700;font-size:15px;line-height:1.5;text-wrap:pretty">Once per round, after you play a Support card, draw 1 card, then discard 1 card.</span><span style="margin-top:auto;font-family:'Patrick Hand',cursive;font-size:15px;color:rgba(42,31,21,.7)">No. 001 · Co-op test rules</span></div>

      <div style="position:relative;width:320px;height:448px;box-sizing:border-box;border:3px solid #2a1f15;border-radius:14px;overflow:hidden;background:#fffaf0">
        <div style="position:absolute;left:58px;right:0;top:0;height:232px;box-sizing:border-box;border-bottom:2.5px solid #2a1f15;background-image:url(art/maple/homestead_barn.jpg);background-size:cover;background-position:62% 58%"></div>
        <div style="position:absolute;left:0;top:0;bottom:0;width:58px;z-index:2;box-sizing:border-box;border-right:2.5px solid #2a1f15;background:#f7a3b3"></div>
