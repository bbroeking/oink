<style>

    .tag.sun { background: #ffd87a; } .tag.sage { background: #c9dec1; } .tag.muted { background: #f6e6d4; color: #6a5c50; box-shadow: none; } .tag.lilac { background: #d6c8f0; } .tag.gold { background: #F5C44A; } .tag.peach { background: #ffc8a8; }

    /* ── The Pen ── */

    .paddock .rail { position: absolute; left: -4px; right: -4px; height: 8px; background: #fff3e2; border: 2px solid #2a1f15; border-radius: 4px; box-sizing: border-box; }
    .paddock .post { position: absolute; width: 12px; height: 72px; background: #fff3e2; border: 2px solid #2a1f15; border-radius: 4px; box-sizing: border-box; }

    .paddock .pig img { width: 100%; height: 100%; object-fit: contain; }
    .paddock .note { position: absolute; left: 50%; transform: translateX(-50%) rotate(-1.5deg); top: 12px; padding: 3px 12px; background: #fffaf0; border: 1.5px solid #2a1f15; border-radius: 8px; box-shadow: 2px 2px 0 #2a1f15; white-space: nowrap; }
    .fenceRow { display: flex; justify-content: space-between; gap: 6px; padding: 0 2px; }
    .med { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; }

    .med .face img.pig { width: 88%; height: 88%; object-fit: contain; border-radius: 999px; }
    .med .face .badge { position: absolute; right: -5px; top: -5px; width: 20px; height: 20px; border-radius: 999px; border: 2px solid #2a1f15; box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 #2a1f15; background: #c9dec1; }
    .med .face .badge img { width: 10px; height: 10px; }

    .med.pressed .face { box-shadow: none; transform: translate(2px, 2px); }
    .med.locked .face { box-shadow: none; background: #f6e6d4; border-style: dashed; }
    .med .nm { font-weight: 800; font-size: 11px; line-height: 14px; letter-spacing: .3px; text-align: center; white-space: nowrap; }
    .med.locked .nm { color: #6a5c50; }
    .motif { width: 28px; height: 28px; border-radius: 999px; border: 1.5px solid #2a1f15; background: #fffaf0; box-shadow: 2px 2px 0 #2a1f15; display: flex; align-items: center; justify-content: center; flex: none; }
    .motif img { width: 16px; height: 16px; }
    .plate { display: inline-flex; align-items: center; min-height: 32px; padding: 2px 14px; border: 2px solid #2a1f15; border-radius: 10px; box-shadow: 2px 2px 0 #2a1f15; box-sizing: border-box; }
    .home2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .homeCell { display: flex; flex-direction: column; gap: 2px; min-height: 52px; padding: 8px 12px; border: 2px solid #2a1f15; border-radius: 12px; background: #fbeee2; box-sizing: border-box; justify-content: center; }
    .homeCell.on { background: #c9dec1; border-width: 3px; box-shadow: 2px 2px 0 #2a1f15; }
    .scrim { position: absolute; inset: 0; background: rgba(42, 31, 21, .42); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .dialog { background: #fffaf0; border: 2px solid #2a1f15; border-radius: 14px; box-shadow: 4px 4px 0 #2a1f15; padding: 18px; transform: rotate(-.8deg); display: flex; flex-direction: column; gap: 10px; width: 100%; box-sizing: border-box; }
    .beat { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px; }
    .beat .dots { display: flex; gap: 6px; }

    .beat .dots i:nth-child(2) { opacity: .7; } .beat .dots i:nth-child(3) { opacity: 1; }
    .empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 16px; text-align: center; }

    /* ── Furnish ── */
    .spots { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fffaf0; border: 2px solid #2a1f15; border-radius: 14px; box-shadow: 2px 2px 0 #2a1f15; box-sizing: border-box; }
    .spots .room { position: relative; width: 64px; height: 50px; border: 2px solid #2a1f15; border-radius: 10px; overflow: hidden; flex: none; box-sizing: border-box; }
    .spots .room img { width: 100%; height: 100%; object-fit: cover; }
    .spots .room .go { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 0; background: rgba(42, 31, 21, .72); color: #fff3e2; font-family: "Patrick Hand", cursive; font-size: 11px; line-height: 13px; text-align: center; }
    .pegs { display: flex; gap: 4px; flex: 1; justify-content: space-between; }
    .peg { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 38px; }
    .peg .box { position: relative; width: 32px; height: 32px; border-radius: 9px; border: 2px solid #2a1f15; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #fffaf0; box-shadow: 2px 2px 0 #2a1f15; }
    .peg .box img { width: 26px; height: 26px; object-fit: contain; }
    .peg.bare .box { border-style: dashed; box-shadow: none; background: transparent; }
    .peg.on .box { background: #ffc8a8; box-shadow: 3px 3px 0 #2a1f15; transform: rotate(-2deg); }
    .peg.new .box:after { content: ""; position: absolute; right: -5px; top: -5px; width: 12px; height: 12px; border-radius: 999px; background: #ffd87a; border: 1.5px solid #2a1f15; box-sizing: border-box; }
    .peg .lbl { font-weight: 800; font-size: 7px; line-height: 10px; letter-spacing: .5px; text-transform: uppercase; color: #605449; text-align: center; white-space: nowrap; }

    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .tile { position: relative; background: #fffaf0; border: 2px solid #2a1f15; border-radius: 14px; box-shadow: 3px 3px 0 #2a1f15; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; }

    .tile .thumb img.art { width: 84px; height: 84px; object-fit: contain; }
    .tile .thumb .rdot { position: absolute; left: 8px; top: 8px; width: 12px; height: 12px; border-radius: 999px; border: 2px solid #2a1f15; box-sizing: border-box; }
    .tile .thumb .badge { position: absolute; right: 8px; top: 8px; width: 24px; height: 24px; border-radius: 999px; border: 2px solid #2a1f15; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: #c9dec1; box-shadow: 2px 2px 0 #2a1f15; }

    .tile .foot { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 10px; }
    .tile .foot .nm { font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 15px; line-height: 19px; letter-spacing: .2px; min-height: 38px; }
    .tile.pressed { box-shadow: none; transform: translate(2px, 2px); }
    .pips { display: flex; gap: 6px; }
    .pip { position: relative; width: 30px; height: 30px; border-radius: 999px; border: 2px dashed #2a1f15; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: transparent; }
    .pip img { width: 20px; height: 20px; object-fit: contain; opacity: .55; }
    .pip.got { border-style: solid; background: #c9dec1; box-shadow: 2px 2px 0 #2a1f15; } .pip.got img { opacity: 1; }
    .pip .n { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); font-weight: 800; font-size: 9px; line-height: 12px; color: #605449; white-space: nowrap; }

    .med { width: 54px; } .fenceRow { gap: 4px; }
    .listRow { min-height: 50px !important; padding: 4px 4px !important; }
    .jobSeg { display: flex; border: 2px solid #2a1f15; border-radius: 999px; background: #fffaf0; box-shadow: 2px 2px 0 #2a1f15; padding: 3px; gap: 2px; }
    .jobSeg span { flex: 1 1 0; min-height: 30px; border-radius: 999px; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; padding: 0 6px; }
    .jobSeg span.on { background: #ffd87a; box-shadow: inset 0 0 0 2px #2a1f15; }
    .jobSeg span.out { background: #d6c8f0; box-shadow: inset 0 0 0 2px #2a1f15; }
    .med.out .face { box-shadow: none; border-style: dashed; background: #f6e6d4; }
    .med.out .face img.pig { opacity: .45; }
    .med.back .face:after { content: ""; position: absolute; right: -4px; top: -4px; width: 14px; height: 14px; border-radius: 999px; background: #ffd87a; border: 2px solid #2a1f15; box-sizing: border-box; }
    .findCoin { width: 44px; height: 44px; border-radius: 999px; border: 2px solid #2a1f15; background: #fffaf0; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 #2a1f15; flex: none; box-sizing: border-box; }
    .findCoin img { width: 30px; height: 30px; object-fit: contain; }
    .findCoin.sm { width: 32px; height: 32px; box-shadow: none; } .findCoin.sm img { width: 22px; height: 22px; }
    .listRow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 4px; border-bottom: 1.5px solid rgba(42,31,21,.14); }
    .listRow:last-child { border-bottom: 0; }
    .listRow .who { width: 40px; height: 40px; border-radius: 999px; border: 2px solid #2a1f15; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; flex: none; box-sizing: border-box; }
    .listRow .who img { width: 92%; height: 92%; object-fit: contain; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fffaf0; border: 2px solid #2a1f15; border-bottom: 0; border-radius: 22px 22px 0 0; padding: 10px 18px 26px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -4px 0 #2a1f15; z-index: 31; }
    .ticket { border: 2px solid #2a1f15; border-radius: 14px; background: #fffaf0; box-shadow: 4px 4px 0 #2a1f15; overflow: hidden; }
    .ticket .stub { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 2px dashed #2a1f15; background: #fbeee2; }
    .ticket .body { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; }
    .pigPick { display: flex; gap: 8px; }
    .pigPick a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border: 2px solid #2a1f15; border-radius: 12px; background: #fbeee2; color: #2a1f15; box-sizing: border-box; }
    .pigPick a.on { background: #ffd87a; box-shadow: 2px 2px 0 #2a1f15; border-width: 3px; }
    .pigPick a.away { border-style: dashed; color: #6a5c50; }
    .pigPick .face { width: 44px; height: 44px; border-radius: 999px; border: 2px solid #2a1f15; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-sizing: border-box; }
    .pigPick .face img { width: 92%; height: 92%; object-fit: contain; }
    .cork { position: relative; border: 2px solid #2a1f15; border-radius: 14px; background: repeating-linear-gradient(45deg, #d9b27f, #d9b27f 6px, #c99c63 6px, #c99c63 7px); box-shadow: 4px 4px 0 #2a1f15; padding: 22px 12px 14px; display: flex; gap: 10px; justify-content: space-around; align-items: flex-start; min-height: 120px; }
    .cork .lbl { position: absolute; top: -10px; left: 14px; padding: 1px 10px; background: #3a2c1e; color: #fff3e2; border: 2px solid #2a1f15; border-radius: 8px; font-weight: 800; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; }
    .pin { position: relative; width: 92px; padding: 14px 8px 8px; background: #fffaf0; border: 1.5px solid #2a1f15; box-shadow: 2px 2px 0 #2a1f15; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; box-sizing: border-box; }
    .pin:before { content: ""; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 999px; background: #a03e2f; border: 1.5px solid #2a1f15; }
    .pin img { width: 34px; height: 34px; object-fit: contain; }
    .pin.paw { background: #f6e6d4; }
    .yard { position: relative; flex: 1; overflow: hidden; background: linear-gradient(180deg, #c8e3f0 0%, #dceef5 55%, #cfe3bd 56%, #b9d4a3 100%); }
    .yard .mound { position: absolute; left: 40px; bottom: 110px; width: 150px; height: 44px; border-radius: 80px 80px 10px 10px; background: #a4743f; border: 2px solid #2a1f15; }
    .yard .gone { position: absolute; left: 50%; bottom: 200px; transform: translateX(-50%) rotate(-1.5deg); padding: 8px 14px; background: #fffaf0; border: 2px solid #2a1f15; border-radius: 12px; box-shadow: 4px 4px 0 #2a1f15; text-align: center; white-space: nowrap; }
    .corner { position: absolute; top: 16px; padding: 8px 12px; background: #ffd6dc; border: 2px solid #2a1f15; border-radius: 12px; box-shadow: 4px 4px 0 #2a1f15; }
    .fanRow { position: absolute; right: 16px; bottom: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
