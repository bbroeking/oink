<helmet>
  <title>A · Drop First</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&amp;family=Nunito:wght@700;800;900&amp;family=Patrick+Hand&amp;family=Fredoka:wght@600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #fbeee2; color: #2a1f15; font-family: "Nunito", "Trebuchet MS", sans-serif; font-weight: 700; font-size: 15px; line-height: 21px; }
    a { color: #a03e2f; } a:hover { color: #2a1f15; }
    img { display: block; } svg { display: block; }
    /* fonts — FONTS.whimsy / FONTS.hand / FONTS.bodyExtra */
    .whimsy { font-family: "Caprasimo", "Cooper Black", Georgia, serif; font-weight: 400; }
    .hand { font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive; font-weight: 400; }
    /* TYPE roles */
    .pageTitle { font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 26px; line-height: 28px; }
    .sectionTitle { font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 22px; line-height: 24px; letter-spacing: .2px; }
    .cardTitle { font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 18px; line-height: 22px; letter-spacing: .2px; }
    .cardTitleSm { font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 15px; line-height: 22px; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .numeral { font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 16px; line-height: 20px; }
    .numeralLg { font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 26px; line-height: 28px; }
    .body { font-size: 15px; line-height: 21px; }
    .bodySm { font-size: 13px; line-height: 18px; }
    .label { font-weight: 800; font-size: 12px; line-height: 16px; letter-spacing: .3px; }
    .kicker { font-family: "Patrick Hand", cursive; font-weight: 400; font-size: 13px; line-height: 18px; letter-spacing: .4px; color: #a03e2f; }
    .handTxt { font-family: "Patrick Hand", cursive; font-weight: 400; font-size: 14px; line-height: 20px; }
    .handLg { font-family: "Patrick Hand", cursive; font-weight: 400; font-size: 17px; line-height: 24px; }
    .kickerPill { font-weight: 800; font-size: 11px; line-height: 14px; letter-spacing: 1.6px; text-transform: uppercase; color: #605449; }
    .kickerPillSm { font-weight: 800; font-size: 10px; line-height: 13px; letter-spacing: 1.6px; text-transform: uppercase; }
    .mute { color: #605449; } .muteDim { color: #6a5c50; }
    /* the phone — paper canvas, status area left alone (no fake chrome) */
    .phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: #fffaf0; display: flex; flex-direction: column; }
    .statusArea { height: 48px; flex: none; }
    /* Sticker — BORDER.ink 2, RADII.lg 14, STICKER_SHADOW 4/4, TILT.card -0.6 */
    .sticker { background: #fffaf0; border: 2px solid #2a1f15; border-radius: 14px; box-shadow: 4px 4px 0 #2a1f15; }
    .sm { box-shadow: 2px 2px 0 #2a1f15; }
    .rule { height: 2px; width: 64px; background: #2a1f15; opacity: .3; border-radius: 1px; }
    /* PageHeader variant=tab — PAGE_PAD 18, paddingTop SPACE.sm */
    .pageHeader { display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 18px 0; }
    .pageHeader .crown { display: flex; flex-direction: column; gap: 4px; }
    /* SectionHeader — kicker (hand, accent, ★) over sectionTitle, right slot = label mute */
    .sectionHeader { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 18px; }
    .sectionHeader .col { display: flex; flex-direction: column; gap: 2px; }
    /* Tag / Chip — RADII.pill, BORDER.thin 1.5, minH 24, pad 2/12, TYPE.label */
    .tag { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 24px; padding: 2px 12px; border: 1.5px solid #2a1f15; border-radius: 999px; font-weight: 800; font-size: 12px; line-height: 16px; letter-spacing: .3px; background: #fffaf0; white-space: nowrap; box-sizing: border-box; }
    .tag.sun { background: #ffd87a; } .tag.sage { background: #c9dec1; } .tag.muted { background: #f6e6d4; color: #6a5c50; }
    .tag.sky { background: #c8e3f0; } .tag.rose { background: #ffd6dc; } .tag.lilac { background: #d6c8f0; } .tag.gold { background: #F5C44A; }
    .tag.stretch { align-self: stretch; }
    .tag img { width: 14px; height: 14px; }
    /* Button — minH 44, RADII.xxl 22, BORDER.ink, label Nunito 800 15 */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 11px 18px; border: 2px solid #2a1f15; border-radius: 22px; background: #ffd87a; font-weight: 800; font-size: 15px; letter-spacing: .1px; box-shadow: 2px 2px 0 #2a1f15; white-space: nowrap; box-sizing: border-box; }
    .btn.gold { background: linear-gradient(180deg, #F8D068, #F5C44A); color: #5A3F00; }
    .btn.ghost { background: #fffaf0; }
    .btn.sm { min-height: 44px; padding: 10px 14px; font-size: 13px; }
    .btn.full { align-self: stretch; }
    /* ShopCard — Sticker radius xl 18, thumb aspect 1.18 on rarity bg, ink bottom rule, rarity dot 14, owned badge 26, foot pad md gap sm */
    .card { position: relative; background: #fffaf0; border: 2px solid #2a1f15; border-radius: 18px; box-shadow: 4px 4px 0 #2a1f15; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; }
    .card.gated { background: #f6e6d4; }
    .card .thumb { position: relative; aspect-ratio: 1.18; border-bottom: 2px solid #2a1f15; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .card .thumb img.art { width: 74%; height: 74%; object-fit: contain; }
    .card .rdot { position: absolute; top: 8px; left: 8px; width: 14px; height: 14px; border-radius: 999px; border: 2px solid #2a1f15; box-shadow: 2px 2px 0 #2a1f15; z-index: 2; }
    .card .owned { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 999px; background: #c9dec1; border: 2px solid #2a1f15; box-shadow: 2px 2px 0 #2a1f15; display: flex; align-items: center; justify-content: center; z-index: 2; }
    .card .owned img { width: 14px; height: 14px; }
    .card .foot { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
    /* Ribbon — slopGold, 120 wide, 35°, kickerPillSm, thin ink rules */
    .ribbon { position: absolute; top: 12px; right: -30px; width: 120px; padding: 2px 0; background: #F5C44A; border-top: 1.5px solid #2a1f15; border-bottom: 1.5px solid #2a1f15; transform: rotate(35deg); z-index: 3; display: flex; align-items: center; justify-content: center; gap: 2px; font-weight: 800; font-size: 10px; line-height: 13px; letter-spacing: 1.6px; text-transform: uppercase; color: #2a1f15; }
    .ribbon img { width: 10px; height: 10px; }
    /* rarity — RARITY_BG_SOLID / RARITY_STRIPE */
    .r-common { background: #FAF7F3; } .r-uncommon { background: #E8F5E0; } .r-rare { background: #E0EBFF; } .r-epic { background: #EFE9FF; } .r-legendary { background: #FFF3D0; }
    .d-common { background: #cdbfae; } .d-uncommon { background: #7ba868; } .d-rare { background: #5a8bc5; } .d-epic { background: #a89bff; } .d-legendary { background: #d4a437; }
    /* the coin pocket in the header (Sticker sun, radius md, tilt 2°) */
    .pocket { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ffd87a; border: 2px solid #2a1f15; border-radius: 12px; box-shadow: 4px 4px 0 #2a1f15; transform: rotate(2deg); }
    .pocket img { width: 20px; height: 20px; }
    .ticketBtn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #fffaf0; border: 2px solid #2a1f15; border-radius: 12px; box-shadow: 2px 2px 0 #2a1f15; box-sizing: border-box; }
    .ticketBtn img { width: 20px; height: 20px; }
    /* a door — paper sticker, radius md, SHADOW_SM, icon over label (≥44pt) */
    .door { position: relative; flex: 1 1 0; min-width: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #fffaf0; border: 2px solid #2a1f15; border-radius: 12px; box-shadow: 2px 2px 0 #2a1f15; padding: 8px 4px; box-sizing: border-box; }
    .door svg, .door img { width: 22px; height: 22px; }
    .door .lbl { font-weight: 800; font-size: 12px; line-height: 16px; letter-spacing: .3px; white-space: nowrap; }
    .door .badge { position: absolute; top: -8px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #ffd87a; border: 2px solid #2a1f15; box-shadow: 2px 2px 0 #2a1f15; font-family: "Caprasimo", Georgia, serif; font-weight: 400; font-size: 13px; line-height: 18px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    /* Avatar — the 32 / 40 / 56 diameters, ink border */
    .avatar { border-radius: 999px; border: 2px solid #2a1f15; background: #fffaf0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; flex: none; box-sizing: border-box; }
    .avatar img { width: 92%; height: 92%; object-fit: contain; }
    /* progress track — 16px capsule, ink border, sage fill */
    .track { height: 16px; border: 2px solid #2a1f15; border-radius: 999px; background: #fffaf0; overflow: hidden; box-sizing: border-box; }
    .track > div { height: 100%; background: #c9dec1; border-right: 2px solid #2a1f15; box-sizing: border-box; }
    /* masking tape (WHIMSY.tape / tapeEdge) */
    .tape { position: absolute; width: 70px; height: 18px; background: #EAD59E; border: 1.5px solid #C8AD77; opacity: .95; transform: rotate(-8deg); z-index: 4; }
    /* hanging-signs tab bar — WOOD rail dirt→dirtDeep, paper signs, Shop active peach */
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(180deg, #8d5a2c, #74441e); border-top: 2px solid #2a1f15; z-index: 20; }
    .tabbar:before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #2a1f15; opacity: .35; }
    .sign { position: absolute; top: 20px; width: 64px; height: 58px; background: #fffaf0; border: 2px solid #2a1f15; border-radius: 10px; box-shadow: 2px 3px 0 #2a1f15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 800; font-size: 11px; box-sizing: border-box; }
    .sign:before { content: ""; position: absolute; top: -18px; left: 50%; width: 2px; height: 18px; background: #2a1f15; transform: translateX(-50%); }
    .sign svg { width: 20px; height: 20px; }
    .sign.on { background: #ffc8a8; transform: rotate(-2deg); }
    /* storefront — WOOD planks, bark chalkboard, rarity coasters */
    .plank { height: 14px; background: linear-gradient(180deg, #8d5a2c, #74441e); border: 2px solid #2a1f15; border-radius: 4px; box-shadow: 2px 3px 0 #2a1f15; box-sizing: border-box; }
    .coaster { width: 78px; height: 78px; border-radius: 999px; border: 2px solid #2a1f15; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .coaster img { width: 58px; height: 58px; object-fit: contain; }
    .chalk { background: #3a2c1e; border: 2px solid #2a1f15; border-radius: 12px; box-shadow: 4px 4px 0 #2a1f15; color: #fff3e2; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box; }
  </style>
</helmet>
