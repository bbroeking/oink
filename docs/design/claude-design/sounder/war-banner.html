<!-- @dsCard group="Sounder" name="Direction 1 — The War Banner" subtitle="Crew as a hanging pennant; members pinned as portrait stickers" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounder — War Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caprasimo&family=Fredoka:wght@700&family=Nunito:wght@700;800&family=Patrick+Hand&display=swap');
  :root{
    --ink:#2a1f15; --paper:#fffaf0; --cream:#fbeee2; --cream2:#f6e6d4;
    --rose:#ffd6dc; --sky:#c8e3f0; --sage:#c9dec1; --sun:#ffd87a;
    --accent:#c25a3f; --mute:rgba(40,30,20,.6); --mutesoft:rgba(40,30,20,.4);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--cream);font-family:'Nunito',sans-serif;color:var(--ink);
       display:flex;justify-content:center;padding:24px 0 48px}
  .phone{width:390px;padding:0 20px;position:relative}
  .splat{position:absolute;opacity:.06;z-index:0}
  .kicker{font-family:'Patrick Hand',cursive;letter-spacing:2.5px;text-transform:uppercase;
          font-size:13px;color:var(--mute);text-align:center;margin:8px 0 2px}
  /* ── rope + banner ─────────────────────────────── */
  .ropeRow{position:relative;height:18px;margin:0 8px}
  .rope{position:absolute;left:0;right:0;top:8px;border-top:3px dashed var(--ink);opacity:.75}
  .nail{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;
        background:var(--ink)}
  .nail.l{left:-2px}.nail.r{right:-2px}
  .banner{position:relative;z-index:1;margin:0 26px;background:var(--sun);
          border:3px solid var(--ink);border-bottom:none;
          box-shadow:4px 4px 0 var(--ink);transform:rotate(-1.2deg);
          clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);
          padding:22px 18px 64px;text-align:center}
  .banner h1{font-family:'Caprasimo',serif;font-size:30px;line-height:1.05}
  .banner .sub{font-family:'Patrick Hand',cursive;font-size:15px;color:var(--mute);margin-top:4px}
  /* ── member pins ───────────────────────────────── */
  .pins{display:flex;justify-content:center;gap:10px;margin:-38px 0 6px;position:relative;z-index:2}
  .pin{width:58px;text-align:center}
  .face{width:56px;height:56px;border-radius:50%;background:var(--paper);
        border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
        display:flex;align-items:center;justify-content:center;position:relative}
  .pin:nth-child(odd) .face{transform:rotate(1.4deg)}
  .pin:nth-child(even) .face{transform:rotate(-1.2deg)}
  .face svg{width:44px;height:44px}
  .face.open{background:var(--cream2);border-style:dashed;box-shadow:none}
  .face.open svg{opacity:.28}
  .crown{position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(-8deg);width:30px}
  .pname{font-family:'Patrick Hand',cursive;font-size:13px;margin-top:5px}
  .pname .role{display:block;font-size:10.5px;letter-spacing:1.5px;color:var(--accent);
               text-transform:uppercase;font-family:'Nunito';font-weight:800}
  .pname.open{color:var(--mutesoft)}
  /* ── shared card + cta ─────────────────────────── */
  .card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;
        box-shadow:4px 4px 0 var(--ink);padding:16px;margin-top:16px;position:relative;z-index:1}
  .card.tilt1{transform:rotate(.5deg)}
  .card.tilt2{transform:rotate(-.6deg)}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
       background:var(--sun);border:3px solid var(--ink);border-radius:999px;
       box-shadow:2px 2px 0 var(--ink);padding:13px;font-family:'Fredoka',sans-serif;
       font-weight:700;font-size:17px;color:var(--ink);cursor:pointer}
  .btn svg{width:20px;height:20px}
  .cardKicker{font-family:'Patrick Hand',cursive;letter-spacing:2px;text-transform:uppercase;
              font-size:12px;color:var(--mute);margin-bottom:8px}
  .search{width:100%;border:2.5px solid var(--ink);border-radius:12px;background:var(--cream);
          padding:11px 14px;font-family:'Nunito';font-weight:700;font-size:14px;color:var(--mute)}
  .leave{display:block;text-align:center;margin-top:18px;font-family:'Patrick Hand',cursive;
         font-size:14px;color:var(--mute);text-decoration:underline}
</style>
</head>
<body>
<div class="phone">
  <!-- mud splats -->
  <svg class="splat" style="top:60px;left:-6px;width:80px" viewBox="0 0 80 60"><path d="M20 30 Q8 18 22 14 Q30 2 42 12 Q60 6 58 24 Q74 30 60 42 Q64 56 46 50 Q34 60 26 46 Q10 48 20 30Z" fill="#2a1f15"/></svg>
  <svg class="splat" style="bottom:120px;right:-10px;width:100px" viewBox="0 0 80 60"><path d="M20 30 Q8 18 22 14 Q30 2 42 12 Q60 6 58 24 Q74 30 60 42 Q64 56 46 50 Q34 60 26 46 Q10 48 20 30Z" fill="#2a1f15"/></svg>

  <p class="kicker">★ your sounder ★</p>

  <div class="ropeRow"><div class="rope"></div><div class="nail l"></div><div class="nail r"></div></div>
  <div class="banner">
    <h1>Sonder</h1>
    <div class="sub">2 of 5 snouts mustered</div>
  </div>

  <div class="pins">
    <div class="pin">
      <div class="face">
        <svg class="crown" viewBox="0 0 40 24"><path d="M4 20 L4 8 L12 14 L20 4 L28 14 L36 8 L36 20 Z" fill="#ffd87a" stroke="#2a1f15" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 64 64"><path d="M14 22 Q10 8 22 12 Q16 16 18 24 Z" fill="#ffd6dc" stroke="#2a1f15" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 22 Q54 8 42 12 Q48 16 46 24 Z" fill="#ffd6dc" stroke="#2a1f15" stroke-width="2.5" stroke-linejoin="round"/><circle cx="32" cy="36" r="20" fill="#ffd6dc" stroke="#2a1f15" stroke-width="2.5"/><ellipse cx="18" cy="41" rx="4" ry="2.5" fill="#f2a9b8" opacity=".7"/><ellipse cx="46" cy="41" rx="4" ry="2.5" fill="#f2a9b8" opacity=".7"/><path d="M22 32 q3 3 6 0" fill="none" stroke="#2a1f15" stroke-width="2.5" stroke-linecap="round"/><path d="M36 32 q3 3 6 0" fill="none" stroke="#2a1f15" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="32" cy="42" rx="8" ry="6" fill="#f7c2cc" stroke="#2a1f15" stroke-width="2.5"/><circle cx="29" cy="42" r="1.4" fill="#2a1f15"/><circle cx="35" cy="42" r="1.4" fill="#2a1f15"/></svg>
      </div>
      <div class="pname">Brian<span class="role">leader</span></div>
    </div>
    <div class="pin">
      <div class="face">
        <svg viewBox="0 0 64 64"><path d="M14 22 Q10 8 22 12 Q16 16 18 24 Z" fill="#ffd6dc" stroke="#2a1f15" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 22 Q54 8 42 12 Q48 16 46 24 Z" fill="#ffd6dc" stroke="#2a1f15" stroke-width="2.5" stroke-linejoin="round"/><circle cx="32" cy="36" r="20" fill="#ffd6dc" stroke="#2a1f15" stroke-width="2.5"/><ellipse cx="18" cy="41" rx="4" ry="2.5" fill="#f2a9b8" opacity=".7"/><ellipse cx="46" cy="41" rx="4" ry="2.5" fill="#f2a9b8" opacity=".7"/><circle cx="25" cy="32" r="2" fill="#2a1f15"/><circle cx="39" cy="32" r="2" fill="#2a1f15"/><ellipse cx="32" cy="42" rx="8" ry="6" fill="#f7c2cc" stroke="#2a1f15" stroke-width="2.5"/><circle cx="29" cy="42" r="1.4" fill="#2a1f15"/><circle cx="35" cy="42" r="1.4" fill="#2a1f15"/></svg>
      </div>
      <div class="pname">Jen</div>
    </div>
    <div class="pin"><div class="face open"><svg viewBox="0 0 64 64"><ellipse cx="32" cy="34" rx="12" ry="9" fill="none" stroke="#2a1f15" stroke-width="3"/><circle cx="27" cy="34" r="2" fill="#2a1f15"/><circle cx="37" cy="34" r="2" fill="#2a1f15"/></svg></div><div class="pname open">open</div></div>
    <div class="pin"><div class="face open"><svg viewBox="0 0 64 64"><ellipse cx="32" cy="34" rx="12" ry="9" fill="none" stroke="#2a1f15" stroke-width="3"/><circle cx="27" cy="34" r="2" fill="#2a1f15"/><circle cx="37" cy="34" r="2" fill="#2a1f15"/></svg></div><div class="pname open">open</div></div>
    <div class="pin"><div class="face open"><svg viewBox="0 0 64 64"><ellipse cx="32" cy="34" rx="12" ry="9" fill="none" stroke="#2a1f15" stroke-width="3"/><circle cx="27" cy="34" r="2" fill="#2a1f15"/><circle cx="37" cy="34" r="2" fill="#2a1f15"/></svg></div><div class="pname open">open</div></div>
  </div>

  <div class="card tilt1">
    <button class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a1f15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21 V4"/><path d="M5 4 Q12 1 19 5 L16 9 L19 13 Q12 10 5 12"/></svg>
      Start a Mud Fight
    </button>
  </div>

  <div class="card tilt2">
    <div class="cardKicker">invite a friend</div>
    <input class="search" value="" placeholder="Search a friend's name">
  </div>

  <a class="leave" href="#">leave your Sounder › no hard feelings</a>
</div>
</body>
</html>
