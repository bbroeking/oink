<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Add me on Tickle the Pig</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			margin: 0;
			min-height: 100vh;
			background: linear-gradient(180deg, #FF95C2 0%, #FFC9DC 100%);
			color: #2A2A2A;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}
		.card {
			background: #FFFFFF;
			border-radius: 24px;
			padding: 28px 24px;
			max-width: 360px;
			width: 100%;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
			text-align: center;
		}
		.emoji { font-size: 54px; margin-bottom: 8px; }
		h1 {
			font-size: 22px;
			margin: 6px 0 2px;
			color: #2A2A2A;
		}
		.handle {
			font-size: 32px;
			margin: 4px 0 18px;
			color: #FF3F87;
			font-weight: 700;
			letter-spacing: 0.5px;
		}
		.btn {
			display: block;
			padding: 13px 18px;
			background: #C194FF;
			color: #2A2A2A;
			text-decoration: none;
			border-radius: 12px;
			font-weight: 600;
			font-size: 17px;
			border: 2px solid #2A2A2A;
			margin: 10px 0;
		}
		.btn.secondary {
			background: transparent;
			border-color: #888;
			color: #555;
			font-size: 14px;
		}
		.muted {
			font-size: 12px;
			color: #888;
			margin-top: 18px;
			line-height: 1.5;
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="emoji">🐷</div>
		<h1>Tickle the Pig</h1>
		<p>You've been invited to add</p>
		<div class="handle" id="handle">—</div>

		<a id="open-app" class="btn" href="#">Open in the app</a>

		<!-- TestFlight fallback: replace the href below with your actual
		     public TestFlight link from App Store Connect.
		     Example: https://testflight.apple.com/join/AbCdEfGh
		     Once on the public App Store, swap for the App Store URL. -->
		<a class="btn secondary"
		   href="https://testflight.apple.com/join/REPLACE_WITH_TESTFLIGHT_TOKEN">
			Don't have the app? Get on TestFlight
		</a>

		<p class="muted">
			If the app doesn't open automatically, tap "Open in the app".
		</p>
	</div>

	<script>
		// Parse the encoded handle from ?h=Brian-4075 — we use `-` instead
		// of `#` because `#` is the URL fragment delimiter and can't ride
		// in a query value.
		const params = new URLSearchParams(location.search);
		const raw = params.get('h') || '';
		const [username, discriminator] = raw.split('-');

		if (username) {
			document.getElementById('handle').textContent =
				discriminator ? `${username}#${discriminator}` : username;
		}

		// Custom-scheme deep link the app intercepts. expo-router route
		// `app/invite.tsx` handles `myapp://invite?u=Brian&d=4075&ref=Brian-4075`.
		// `ref` is The Sounder attribution; forward whatever came in.
		const ref = params.get('ref');
		const appLink = username
			? `myapp://invite?u=${encodeURIComponent(username)}` +
			  (discriminator ? `&d=${encodeURIComponent(discriminator)}` : '') +
			  (ref ? `&ref=${encodeURIComponent(ref)}` : '')
			: 'myapp://';

		document.getElementById('open-app').href = appLink;

		// Auto-attempt to open the app immediately. If the app isn't
		// installed, iOS will silently fail and the user stays on this
		// page where the TestFlight button is visible.
		setTimeout(() => {
			window.location.href = appLink;
		}, 150);
	</script>
</body>
</html>
