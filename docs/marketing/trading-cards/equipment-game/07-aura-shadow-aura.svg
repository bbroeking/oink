			<text x="44" y="52" fill="#21181B" font-family="Fredoka" font-size="37">◌</text>
			<text x="92" y="51" fill="#21181B" font-family="Nunito"
				font-size="29" letter-spacing="3">AURA</text>
		</g>

		<text x="1410" y="132" text-anchor="end" fill="#FFF9ED" font-family="Nunito"
