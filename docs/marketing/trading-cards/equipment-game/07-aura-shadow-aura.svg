		<rect x="72" y="1720" width="1356" height="174" rx="30"
			fill="#100B10" fill-opacity=".82" stroke="#FFF9ED" stroke-opacity=".22"
			stroke-width="3"/>
		
		<g>
			
			<text x="92" y="1811" fill="#FA716B" font-family="Fredoka"
