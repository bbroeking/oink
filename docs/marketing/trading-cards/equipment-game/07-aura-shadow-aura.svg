			<text x="442" y="1834" text-anchor="end" fill="#FFF9ED"
				font-family="Caprasimo" font-size="86">3</text>
		</g>
		<g>
			<path d="M508 1745 V1867" stroke="#FFF9ED" stroke-opacity=".24"
