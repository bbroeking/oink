<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="750" height="1050" viewBox="0 0 750 1050">
    <defs>
      <clipPath id="card"><rect x="10" y="10" width="730" height="1030" rx="34"/></clipPath>
      <linearGradient id="frameTint" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F17868"/>
        <stop offset="1" stop-color="#2A1F15"/>
      </linearGradient>
      <linearGradient id="abilityTint" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F58B78"/>
        <stop offset="1" stop-color="#F17868" stop-opacity=".9"/>
      </linearGradient>
      <filter id="hardLift" x="-20%" y="-20%" width="140%" height="140%">
        <feFlood flood-color="#2A1F15" result="shadowColor"/>
        <feComposite in="shadowColor" in2="SourceAlpha" operator="in" result="shadow"/>
        <feOffset in="shadow" dx="3" dy="4" result="offsetShadow"/>
        <feMerge><feMergeNode in="offsetShadow"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <mask id="frameWithArtWindow">
        <rect width="750" height="1050" fill="white"/>
        <rect x="40" y="204" width="670" height="424" rx="15" fill="black"/>
      </mask>
    </defs>

    <g clip-path="url(#card)">
      <g mask="url(#frameWithArtWindow)">
        <rect x="10" y="10" width="730" height="1030" fill="#2A1F15"/>

        <!-- One uniform, cut-safe silhouette with the pig-ear crown contained inside it. -->
        <path d="M35 42 Q35 28 53 29 L112 31 L126 45
          Q188 34 375 34 Q562 34 624 45 L638 31 L697 29 Q715 28 715 42
          L715 1009 Q715 1023 701 1023 H49 Q35 1023 35 1009Z"
          fill="url(#frameTint)" stroke="#F17868" stroke-width="5"/>
      </g>
      <path d="M45 52 L111 53 L128 64 Q200 49 375 49 Q550 49 622 64
        L639 53 L705 52" fill="none" stroke="#FFF0DD" stroke-opacity=".36"
        stroke-width="3"/>

      <!-- Identity panel -->
      <path d="M60 58 Q60 48 73 48 H566 Q584 48 596 60
        L666 47 Q690 44 690 65 V181 Q690 197 672 197 H73 Q60 197 60 184Z"
        fill="#FFF0DD" stroke="#2A1F15" stroke-width="4"/>
      <path d="M76 197 H270" stroke="#5F8D5C" stroke-width="7"/>
      <g transform="translate(79 64)">
        <path d="M0 0 H104 L96 31 H0Z" fill="#5F8D5C"/>
        <text x="12" y="22" fill="#FFF0DD" font-family="Nunito"
          font-size="20" font-weight="900">LEGEND</text>
      </g>
      <text x="80" y="137" fill="#2A1F15" font-family="Fredoka"
        font-size="62" font-weight="700">Pickles</text>
      <text x="82" y="177" fill="#2A1F15" font-family="Nunito"
        font-size="28" font-weight="900">Orchard Finder</text>

      <!-- Cheer is an irregular storybook medallion, not a generic stat circle. -->
      <g transform="translate(625 104) scale(.86)" filter="url(#hardLift)">
        <path d="M0-42 C39-53 62-22 56 12 C51 42 20 59 0 70
          C-20 59-51 42-56 12 C-62-22-39-53 0-42Z"
          fill="#5F8D5C" stroke="#2A1F15" stroke-width="7"/>
        <path d="M0-32 C30-40 45-17 41 9 C37 31 15 44 0 54
          C-15 44-37 31-41 9 C-45-17-30-40 0-32Z"
          fill="#2A1F15" opacity=".92" stroke="#FFF0DD" stroke-width="3"/>
        <text x="0" y="18" text-anchor="middle" fill="#FFF0DD"
          font-family="Caprasimo" font-size="52">12</text>
        <text x="0" y="43" text-anchor="middle" fill="#FFF0DD"
          font-family="Nunito" font-size="19" font-weight="900">CHEER</text>
      </g>

      <!-- Illustration window: the full-art source remains uninterrupted here. -->
      <rect x="40" y="204" width="670" height="424" rx="15"
        fill="none" stroke="#2A1F15" stroke-width="8"/>
      <rect x="46" y="210" width="658" height="412" rx="10"
        fill="none" stroke="#FFF0DD" stroke-opacity=".58" stroke-width="2"/>

      <!-- Flavor caption makes the art and rules feel like one storybook object. -->
      <path d="M40 627 H710 V672 Q710 682 699 682 H51 Q40 682 40 672Z"
        fill="#FFF0DD" stroke="#2A1F15" stroke-width="4"/>
      <text x="375" y="659" text-anchor="middle" fill="#2A1F15"
        font-family="Patrick Hand" font-size="22">Pickles has never met a patch that was finished hiding.</text>

      <!-- Ability panel -->
      <path d="M40 682 H710 V884 H40Z" fill="url(#abilityTint)"
        stroke="#2A1F15" stroke-width="4"/>
      <g transform="translate(85 753)">
        <path d="M0-39 L31-22 L43 10 L26 42 L-8 47 L-39 28 L-45-6 L-27-36Z"
          fill="#5F8D5C" stroke="#FFF0DD" stroke-width="5"/>
        <g transform="translate(0 -27) scale(0.34)" fill="#FFF0DD"><path d="M0 0 L10 27 L38 38 L10 49 L0 78 L-10 49 L-38 38 L-10 27Z"/></g>
        <circle cx="36" cy="40" r="16" fill="#FFF0DD"
          stroke="#2A1F15" stroke-width="4"/>
      </g>
      <text x="150" y="735" fill="#2A1F15" font-family="Caprasimo"
        font-size="37">Orchard Nose</text>
      <text x="152" y="774" fill="#2A1F15" font-family="Nunito"
        font-size="28" font-weight="800">
        <tspan x="152" dy="0">At the start of your turn, look at</tspan><tspan x="152" dy="34">the top card of your deck; you may</tspan><tspan x="152" dy="34">put it on the bottom.</tspan>
      </text>

      <!-- Persistent rules and production metadata -->
      <path d="M40 884 H710 V960 H40Z" fill="#2A1F15"
        stroke="#F17868" stroke-width="4"/>
      <text x="61" y="930" fill="#FFF0DD" font-family="Nunito"
        font-size="22" font-weight="900">STYLES</text>
      <g transform="translate(242 897)">
      <rect width="200" height="52" rx="7" fill="#6FAE8A" stroke="#FFF0DD" stroke-width="4"/>
      <g transform="translate(34 8) scale(0.25)" fill="#FFF0DD"><path d="M0 0 L32 11 V38 C32 60 15 74 0 82 C-15 74-32 60-32 38 V11Z"/></g>
      <text x="72" y="35" fill="#FFF0DD" font-family="Nunito"
        font-size="22" font-weight="900">STEADY</text>
    </g><g transform="translate(456 897)">
      <rect width="200" height="52" rx="7" fill="#9A7DE0" stroke="#FFF0DD" stroke-width="4"/>
      <g transform="translate(34 8) scale(0.25)" fill="#FFF0DD"><path d="M0 0 L10 27 L38 38 L10 49 L0 78 L-10 49 L-38 38 L-10 27Z"/></g>
      <text x="72" y="35" fill="#FFF0DD" font-family="Nunito"
        font-size="22" font-weight="900">SPARK</text>
    </g>
      <path d="M40 960 H710 V1023 H40Z" fill="#2A1F15"
        stroke="#F17868" stroke-width="4"/>
      <g transform="translate(65 991)">
        <ellipse rx="17" ry="20" fill="#F17868" stroke="#FFF0DD" stroke-width="3"/>
        <ellipse cx="-6" cy="0" rx="3.5" ry="7" fill="#2A1F15"/>
        <ellipse cx="6" cy="0" rx="3.5" ry="7" fill="#2A1F15"/>
      </g>
      <text x="94" y="999" fill="#FFF0DD" font-family="Nunito"
        font-size="22" font-weight="900">005/88</text>
      <text x="684" y="999" text-anchor="end" fill="#FFF0DD" font-family="Nunito"
        font-size="22" font-weight="900">OUTSIDE DECK</text>
    </g>
    <rect x="10" y="10" width="730" height="1030" rx="34" fill="none"
      stroke="#2A1F15" stroke-width="20"/>
  </svg>