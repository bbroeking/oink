defaults.url=https://sentry.io/
defaults.org=broeking-industries
defaults.project=react-native

# The auth token is NOT stored here (this file is committed).
# It lives in `.env.sentry-build-plugin` at the repo root (gitignored via .env*):
#   SENTRY_AUTH_TOKEN=sntrys_...
# Both Sentry build phases source that file via SENTRY_DOTENV_PATH.
# Escape hatches: SENTRY_DISABLE_AUTO_UPLOAD=true skips uploads,
# SENTRY_ALLOW_FAILURE=true lets a failed upload not fail the build.
