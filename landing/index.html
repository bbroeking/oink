<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tickle the Pig — you've got a code</title>
<meta name="description" content="Your friend invited you to Tickle the Pig. Grab your code and join in." />
<!-- Open Graph so the link looks good when shared in iMessage / social.
     Absolute URLs are required — relative paths don't resolve in scrapers. -->
<meta property="og:title" content="Come tickle a pig with me" />
<meta property="og:description" content="Your friend's code is inside. Join the Tickle the Pig beta." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://ticklethepig.com" />
<meta property="og:image" content="https://ticklethepig.com/og.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Rosie — a cheerful pink pig — Tickle the Pig" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Come tickle a pig with me" />
<meta name="twitter:description" content="Your friend's code is inside. Join the Tickle the Pig beta." />
<meta name="twitter:image" content="https://ticklethepig.com/og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #2a1f15;
    --paper: #fffaf0;
    --cream: #f7efe1;
    --rose: #ffd6dc;
    --rose-deep: #f8a8b3;
    --sage: #c9dec1;
    --sun: #ffd87a;
    --lilac: #d6c8f0;
    --mute: #9a8c7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 12% 18%, rgba(255,214,220,.45), transparent 38%),
      radial-gradient(circle at 88% 82%, rgba(214,200,240,.40), transparent 40%),
      var(--paper);
    color: var(--ink);
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    min-height: 100%;
    overflow-x: hidden;
  }

  /* ---- floating background confetti stars ---- */
  .bg-stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-stars b {
    position: absolute;
    color: var(--rose-deep);
    font-size: 18px;
    opacity: .5;
    animation: float-up linear infinite;
  }
  @keyframes float-up {
    0%   { transform: translateY(20px) rotate(0deg) scale(.6); opacity: 0; }
    15%  { opacity: .55; }
    85%  { opacity: .55; }
    100% { transform: translateY(-110vh) rotate(220deg) scale(1); opacity: 0; }
  }

  /* ---- card ---- */
  .card {
    position: relative;
    z-index: 1;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 26px;
    box-shadow: 8px 8px 0 var(--ink);
    max-width: 680px;
    width: 100%;
    padding: 26px 30px 26px;
    transform: rotate(-0.6deg) scale(.94);
    opacity: 0;
    animation: card-pop .7s cubic-bezier(.2,1.3,.4,1) .05s forwards;
  }
  @keyframes card-pop {
    0%   { opacity: 0; transform: rotate(3deg) scale(.86) translateY(18px); }
    70%  { opacity: 1; transform: rotate(-1.4deg) scale(1.012) translateY(0); }
    100% { opacity: 1; transform: rotate(-0.6deg) scale(1); }
  }

  /* ---- hero row ---- */
  .hero {
    display: grid;
    grid-template-columns: 1fr 208px;
    gap: 14px;
    align-items: center;
  }
  .copy-col { padding-top: 4px; }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rose-deep);
    font-weight: 800;
    margin-bottom: 12px;
    opacity: 0;
    animation: rise .55s ease-out .35s forwards;
  }
  .kicker .tw {
    display: inline-block;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  .kicker .tw:last-child { animation-delay: 1.2s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(1) rotate(0); opacity: .9; }
    50%      { transform: scale(1.35) rotate(18deg); opacity: 1; }
  }

  h1 {
    font-family: "Archivo Black", "Archivo", sans-serif;
    font-weight: 900;
    font-size: clamp(34px, 6vw, 52px);
    line-height: 1.0;
    letter-spacing: -1px;
    margin-bottom: 14px;
  }
  h1 .l1 { display: block; white-space: nowrap; opacity: 0; animation: rise .55s ease-out .45s forwards; }
  h1 .l2 { display: inline-block; white-space: nowrap; opacity: 0; animation: rise .55s ease-out .58s forwards; position: relative; }
  /* yellow highlighter swipe under "a pig." */
  h1 .l2::after {
    content: "";
    position: absolute;
    left: -2px; right: -2px;
    bottom: 6px;
    height: 14px;
    background: var(--sun);
    border-radius: 4px;
    z-index: -1;
    transform: scaleX(0);
    transform-origin: left center;
    animation: swipe .5s cubic-bezier(.5,0,.2,1) 1.0s forwards;
  }
  @keyframes swipe { to { transform: scaleX(1); } }

  .sub {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    opacity: 0;
    animation: rise .55s ease-out .72s forwards;
  }
  .sub .arrow {
    color: var(--rose-deep);
    font-size: 15px;
    animation: nudge 1.6s ease-in-out infinite;
  }
  @keyframes nudge { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- Rosie ---- */
  .rosie-col {
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: stretch;
  }
  .rosie-stage {
    position: relative;
    width: 100%;
    max-width: 214px;
    aspect-ratio: 370 / 383;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* soft rose halo behind her */
  .rosie-stage::before {
    content: "";
    position: absolute;
    inset: 14% 8% 16% 8%;
    background: radial-gradient(circle, rgba(255,214,220,.85), rgba(255,214,220,0) 70%);
    border-radius: 50%;
    z-index: 0;
    animation: halo 3.4s ease-in-out infinite;
  }
  @keyframes halo { 0%,100%{transform:scale(.96);opacity:.8;} 50%{transform:scale(1.06);opacity:1;} }
  .rosie-wrap {
    position: relative;
    z-index: 1;
    opacity: 0;
    transform-origin: 50% 88%;
    animation: rosie-in .7s cubic-bezier(.2,1.4,.4,1) .55s forwards;
  }
  .rosie {
    width: 100%;
    display: block;
    transform-origin: 50% 88%;
    animation: bob 3.2s ease-in-out 1.3s infinite;
    will-change: transform;
  }
  @keyframes rosie-in {
    0% { opacity: 0; transform: scale(.4) rotate(-12deg) translateY(30px); }
    70%{ opacity: 1; transform: scale(1.06) rotate(3deg); }
    100%{ opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-7px) rotate(1deg);} }
  /* tickle reaction */
  .rosie-stage.tickled .rosie { animation: wiggle .5s ease-in-out 1; }
  @keyframes wiggle {
    0%,100%{ transform: rotate(0) translateY(0); }
    15%{ transform: rotate(-7deg) translateY(-4px); }
    30%{ transform: rotate(6deg) translateY(-8px); }
    45%{ transform: rotate(-6deg) translateY(-4px); }
    60%{ transform: rotate(5deg) translateY(-7px); }
    75%{ transform: rotate(-4deg) translateY(-2px); }
  }
  .giggle {
    position: absolute;
    top: 2%; left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    font-size: 13px;
    font-weight: 800;
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }
  .giggle.show { animation: pop-giggle 1.1s ease-out 1; }
  @keyframes pop-giggle {
    0%{ opacity:0; transform: translateX(-50%) translateY(6px) scale(.6); }
    25%{ opacity:1; transform: translateX(-50%) translateY(-6px) scale(1); }
    75%{ opacity:1; transform: translateX(-50%) translateY(-10px) scale(1); }
    100%{ opacity:0; transform: translateX(-50%) translateY(-22px) scale(.9); }
  }
  .spark {
    position: absolute;
    font-size: 16px;
    pointer-events: none;
    z-index: 2;
    animation: spark-fly .8s ease-out forwards;
  }
  @keyframes spark-fly {
    0%{ opacity: 0; transform: translate(0,0) scale(.2); }
    20%{ opacity: 1; }
    100%{ opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--dr)); }
  }
  .hint {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--mute);
    margin-top: 4px;
    opacity: 0;
    animation: rise .5s ease-out 1.5s forwards;
  }

  /* ---- functional block ---- */
  .panel {
    margin-top: 16px;
    opacity: 0;
    animation: rise .55s ease-out .9s forwards;
  }
  .code-label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 7px;
  }
  .code-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--cream);
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    padding: 12px 12px 12px 16px;
    margin-bottom: 12px;
  }
  .code {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--ink);
  }
  .copy-btn {
    border: 2.5px solid var(--ink);
    background: var(--sun);
    border-radius: 11px;
    padding: 9px 16px;
    font-family: "Archivo", sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .copy-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
  .copy-btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  .join-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--lilac);
    border: 3px solid var(--ink);
    border-radius: 15px;
    padding: 16px;
    font-family: "Archivo", sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 4px 4px 0 var(--ink);
    margin-bottom: 14px;
    transition: transform .1s, box-shadow .1s;
  }
  .join-btn .ja { transition: transform .2s; }
  .join-btn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
  .join-btn:hover .ja { transform: translateX(5px); }
  .join-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
  .steps {
    font-size: 14px;
    color: var(--ink);
    background: var(--sage);
    border: 2.5px solid var(--ink);
    border-radius: 15px;
    padding: 13px 16px;
    line-height: 1.5;
  }
  .steps strong { font-weight: 800; }
  .steps ol { margin: 4px 0 0 20px; }
  .steps li { margin-bottom: 3px; }
  .no-code {
    color: var(--mute);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    background: var(--cream);
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }

  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 540px) {
    .card { padding: 26px 22px 24px; }
    .hero { grid-template-columns: 1fr; gap: 4px; }
    .rosie-col { order: -1; }
    .rosie-stage { max-width: 190px; }
    h1 { font-size: clamp(34px, 11vw, 46px); }
    .hint { margin-bottom: 4px; }
  }

  /* safety net: if intro animations never run (background tab / throttled),
     force the reveal so content is never stuck invisible */
  body.shown .card { opacity: 1; transform: rotate(-0.6deg); }
  body.shown .kicker,
  body.shown h1 .l1,
  body.shown h1 .l2,
  body.shown .sub,
  body.shown .panel,
  body.shown .hint { opacity: 1; }
  body.shown .card,
  body.shown .kicker,
  body.shown h1 .l1,
  body.shown h1 .l2,
  body.shown h1 .l2::after,
  body.shown .sub,
  body.shown .panel,
  body.shown .hint,
  body.shown .rosie-wrap { animation: none !important; }
  body.shown .rosie-wrap { opacity: 1; }
  body.shown h1 .l2::after { transform: scaleX(1); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card, .kicker, h1 .l1, h1 .l2, .sub, .rosie, .panel, .hint { opacity: 1 !important; transform: none !important; }
    h1 .l2::after { transform: scaleX(1) !important; }
  }
</style>
</head>
<body>
  <div class="bg-stars" id="bgStars" aria-hidden="true"></div>

  <div class="card">
    <div class="hero">
      <div class="copy-col">
        <div class="kicker"><span class="tw">★</span> Tickle the Pig <span class="tw">★</span></div>
        <h1>
          <span class="l1">Come tickle</span>
          <span class="l2">a pig.</span>
        </h1>
        <div class="sub">A friend sent you a code <span class="arrow">▶</span></div>
      </div>

      <div class="rosie-col">
        <div class="rosie-stage" id="rosieStage" role="button" tabindex="0" aria-label="Tickle Rosie the pig">
          <div class="giggle" id="giggle">hehehe!</div>
          <div class="rosie-wrap"><img class="rosie" src="rosie.png" alt="Rosie the pig" draggable="false" /></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div id="code-block">
        <div class="code-label">Your friend's code</div>
        <div class="code-pill">
          <span class="code" id="code">—</span>
          <button class="copy-btn" id="copy">Copy</button>
        </div>
      </div>

      <!-- Public TestFlight link during beta; swap to the App Store
           badge/link at launch — single-button change, no rebuild. -->
      <a class="join-btn" id="join" href="https://testflight.apple.com/join/5dDhSNN9">
        Join the beta <span class="ja">→</span>
      </a>

      <div class="steps">
        <strong>How to redeem:</strong>
        <ol>
          <li>Tap <em>Copy</em> above.</li>
          <li>Join the beta + install the app.</li>
          <li>When the app asks for a code, paste it in.</li>
        </ol>
      </div>
    </div>
  </div>

  <p class="hint" style="position:fixed;bottom:10px;left:0;right:0;">psst — tap Rosie 🐽</p>

  <div class="toast" id="toast">Code copied ✓</div>

<script>
  /* reveal safety net (covers background-tab animation throttling) */
  setTimeout(function () { document.body.classList.add('shown'); }, 1600);

  /* ---------- background confetti stars ---------- */
  (function () {
    var wrap = document.getElementById('bgStars');
    var glyphs = ['★', '✦', '✧', '♥'];
    var n = window.innerWidth < 540 ? 9 : 16;
    for (var i = 0; i < n; i++) {
      var s = document.createElement('b');
      s.textContent = glyphs[i % glyphs.length];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (12 + Math.random() * 14) + 'px';
      var dur = 9 + Math.random() * 10;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's';
      s.style.color = i % 4 === 3 ? '#f8a8b3' : (i % 2 ? '#d6c8f0' : '#f8a8b3');
      wrap.appendChild(s);
    }
  })();

  /* ---------- tickle Rosie ---------- */
  (function () {
    var stage = document.getElementById('rosieStage');
    var giggle = document.getElementById('giggle');
    var giggles = ['hehehe!', 'oink!', 'teehee!', 'wheee!', 'snort!'];
    var sparks = ['★', '✦', '♥', '✧'];
    var gi = 0;
    function burst() {
      for (var i = 0; i < 9; i++) {
        var s = document.createElement('span');
        s.className = 'spark';
        s.textContent = sparks[i % sparks.length];
        s.style.left = (35 + Math.random() * 30) + '%';
        s.style.top = (30 + Math.random() * 30) + '%';
        s.style.color = i % 2 ? '#f8a8b3' : '#ffd87a';
        var ang = Math.random() * Math.PI * 2;
        var dist = 50 + Math.random() * 55;
        s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        s.style.setProperty('--dy', (Math.sin(ang) * dist - 30) + 'px');
        s.style.setProperty('--dr', (Math.random() * 360 - 180) + 'deg');
        stage.appendChild(s);
        (function (el) { setTimeout(function () { el.remove(); }, 820); })(s);
      }
    }
    function tickle() {
      stage.classList.remove('tickled');
      void stage.offsetWidth; /* restart animation */
      stage.classList.add('tickled');
      giggle.textContent = giggles[gi++ % giggles.length];
      giggle.classList.remove('show');
      void giggle.offsetWidth;
      giggle.classList.add('show');
      burst();
    }
    stage.addEventListener('click', tickle);
    stage.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tickle(); }
    });
  })();

  /* ---------- referral code ---------- */
  // Pull the code out of the path: /r/ROSIE-K3T9  (also tolerate ?code=).
  // Matches the format the app emits + validates (REFERRAL_CODE_PATTERN
  // in utils/referrals.ts): 5 letters, dash, 4 alphanumerics.
  var PATTERN = /^[A-Z]{5}-[A-Z0-9]{4}$/;
  function extractCode() {
    var m = window.location.pathname.match(/\/r\/([^\/?#]+)/i);
    var raw = m ? m[1] : (new URLSearchParams(window.location.search).get('code') || '');
    var c = decodeURIComponent(raw).toUpperCase().trim();
    return PATTERN.test(c) ? c : null;
  }

  var code = extractCode();
  var codeEl = document.getElementById('code');
  var copyBtn = document.getElementById('copy');
  var codeBlock = document.getElementById('code-block');
  var toast = document.getElementById('toast');

  if (code) {
    codeEl.textContent = code;
    // Pre-warm the clipboard so the in-app first-launch clipboard sniff
    // (parseReferralCodeFromClipboard) can pick it up. Best-effort —
    // browsers may block clipboard writes without a user gesture, so the
    // Copy button is the reliable path.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).catch(function () {});
    }
  } else {
    codeBlock.innerHTML = '<p class="no-code">Hmm — this link is missing its code. You\'ll need one to join the beta, so ask your friend to re-send their invite link.</p>';
  }

  function showToast() {
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  copyBtn.addEventListener('click', function () {
    if (!code) return;
    var done = function () { copyBtn.textContent = 'Copied'; showToast(); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(function () {
        legacyCopy(); done();
      });
    } else {
      legacyCopy(); done();
    }
  });

  function legacyCopy() {
    var ta = document.createElement('textarea');
    ta.value = code; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
</script>
</body>
</html>
