<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Golden Ticket — Tickle the Pig</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/sticker.css">
  <style>
    /* No :root here — the web is a consumer of theme.ts (design-system-spec §3
       rule 7). Claiming a Golden Ticket is a Collect moment: it wears the same
       sticker, the same ink, the same four faces as the shop. */
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:var(--space-xl);
      color:var(--text-primary);
      background:radial-gradient(circle at 50% 10%, var(--paper) 0, var(--cream) 42%, var(--fill-rose) 100%);
      font:var(--type-body);
    }
    main.sticker { width:min(440px,100%); padding:var(--space-xxl) var(--space-xl); text-align:center; }
    .pig { width:var(--art-portrait); height:var(--art-portrait); margin:auto; border-radius:var(--radius-xxl); }
    .kicker { margin:var(--space-lg) 0 var(--space-xs); }
    h1 { margin:0; font:var(--type-display-lg); }
    main > p { margin:var(--space-md) 0 0; font:var(--type-body); }
    .code {
      margin:var(--space-lg) 0;
      font:var(--type-numeral-lg); letter-spacing:var(--tracking-kicker-pill);
    }
    .btn { margin-top:var(--space-card); }
    small { display:block; margin-top:var(--space-lg); font:var(--type-hand); color:var(--ink-mute); }
  </style>
</head>
<body>
  <main class="sticker sticker--dialog">
    <img class="pig" src="/rosie.png" alt="Rosie the pig">
    <div class="kicker">Golden Ticket</div>
    <h1>Keep this code</h1>
    <p>If Tickle the Pig is installed, this link opens the claim screen. Otherwise, install the app and enter the code in the Shop scanner.</p>
    <div class="code sticker sticker--sun sticker--sm sticker--straight" id="code">PIG-XXXX-XXXX</div>
    <a class="btn btn--primary btn--lg btn--full" href="https://apps.apple.com/us/app/tickle-the-pig/id6740339848">Download on the App Store</a>
    <small>Each account can claim a shared event code once, while supplies last.</small>
  </main>
  <script>
    const match = location.pathname.match(/\/redeem\/([^/?#]+)/i);
    if (match) document.getElementById("code").textContent = decodeURIComponent(match[1]).toUpperCase();
  </script>
</body>
</html>
