<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement Studio</title>
<style>
  :root{
    --ink:#3b2a1e;--cream:#fdf6ec;--panel:#fffdf8;--line:#e7d8c4;--gold:#caa04a;
    --green:#3f9d63;--blue:#5c9dff;--red:#cf5b4e;--muted:#8c7a66;--chip:#f1e7d6;
    --shadow:0 2px 0 #e7d8c4,0 6px 18px rgba(80,60,40,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--ink);background:var(--cream);height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:2px solid var(--line);
    background:rgba(253,246,236,.97);flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:800}
  .tabs{display:flex;gap:6px}
  .tab{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;
    font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .status{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .status b{color:var(--green)}
  main{flex:1;display:flex;min-height:0}
  /* ITEMS MODE */
  .rail{width:270px;border-right:2px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
  .railhead{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .railhead input{border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px;font-size:11.5px;
    font-weight:700;cursor:pointer;color:var(--muted)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .list{overflow-y:auto;flex:1}
  .row{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;border-bottom:1px solid #f3ece0}
  .row:hover{background:#faf3e7}
  .row.sel{background:#f3e7cf}
  .row.rej{background:#fbecea}
  .row.rej.sel{background:#f4d8d2}
  .rejmark{color:var(--red);font-weight:800}
  .row .th{width:38px;height:38px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:#f3ece0;background-image:linear-gradient(45deg,#e4d8c6 25%,transparent 25%),linear-gradient(-45deg,#e4d8c6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4d8c6 75%),linear-gradient(-45deg,transparent 75%,#e4d8c6 75%);
    background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;overflow:hidden}
  .row .th img{max-width:100%;max-height:100%}
  .row .meta{min-width:0;flex:1}
  .row .id{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .cat{font-size:10.5px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.tuned{background:var(--green)}
  .dot.def{background:var(--gold)}
  .dot.none{background:#cbbfa e;background:#d7c8b2}
  /* STAGE */
  .stagewrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;
    background:radial-gradient(circle at 50% 40%,#fffdf8,#f4ead9)}
  .animbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;
    align-items:center;gap:6px;flex-wrap:wrap;max-width:92%;background:rgba(255,253,248,.96);
    border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;box-shadow:var(--shadow)}
  .animbar select{padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px;color:var(--ink);background:var(--panel)}
  .animbar .fb{border:1.5px solid var(--line);background:var(--panel);border-radius:7px;min-width:26px;height:26px;
    font-size:12px;font-weight:800;cursor:pointer;color:var(--ink)}
  .animbar .fb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stage{position:relative;background:#fbf4e8;border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .stage .pig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .stage .pig img{width:100%;height:100%;object-fit:contain}
  .stage .item{position:absolute}
  .stage .item img{width:100%;height:100%;object-fit:contain}
  .anchorDot{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid #fff;
    background:#5c9dff;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4);z-index:30}
  .anchorDot.on{background:var(--red);width:17px;height:17px}
  .anchorDot .lbl{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:9px;font-weight:800;
    color:#3b2a1e;background:rgba(255,255,255,.85);padding:0 3px;border-radius:3px;white-space:nowrap;pointer-events:none}
  /* RIGHT PANEL */
  .panel{width:300px;border-left:2px solid var(--line);background:var(--panel);padding:14px;overflow-y:auto;
    display:flex;flex-direction:column;gap:14px}
  .panel h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:#6e5a44}
  .itemcanvas{width:150px;height:150px;margin:0 auto;position:relative;border:1.5px dashed var(--line);border-radius:10px;
    background:#f3ece0;background-image:linear-gradient(45deg,#e4d8c6 25%,transparent 25%),linear-gradient(-45deg,#e4d8c6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4d8c6 75%),linear-gradient(-45deg,transparent 75%,#e4d8c6 75%);
    background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;cursor:crosshair;touch-action:none}
  .itemcanvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
  .pivotMark{position:absolute;width:14px;height:14px;border:2.5px solid var(--red);background:rgba(207,91,78,.35);
    border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;font-weight:700;color:#6e5a44;display:flex;justify-content:space-between}
  .fld label span{color:var(--muted);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--gold)}
  select,.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:8px;font:inherit;
    font-size:13px;color:var(--ink);cursor:pointer}
  .btn{font-weight:800}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.ghost{background:var(--panel)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.45}
  .rejbox{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
  .rejbox .toggle{color:var(--red)}
  .empty{margin:auto;color:var(--muted)}
  /* PIG MODE */
  .pigbar{display:flex;gap:6px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .seg{display:flex;gap:4px}
  .anchorList{font-size:12px;color:var(--muted)}
  .anchorList .ar{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #f3ece0}
  .syncbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:10px;font-weight:800;
    padding:1px 6px;cursor:pointer;color:#7a674f;margin-left:6px;white-space:nowrap}
  .syncbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .anchorList .ar.miss{color:var(--red);font-weight:700}
  .dragDot{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:var(--green);
    transform:translate(-50%,-50%);cursor:grab;z-index:30;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .dragDot .lbl{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-size:9px;font-weight:800;
    color:#3b2a1e;background:rgba(255,255,255,.85);padding:0 3px;border-radius:3px;white-space:nowrap;pointer-events:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🐷 Placement Studio</h1>
  <div class="tabs">
    <button class="tab on" data-m="items">Items</button>
    <button class="tab" data-m="pig">Pig anatomy</button>
  </div>
  <div class="status" id="status">loading…</div>
</header>

<!-- ITEMS MODE -->
<main id="mode-items">
  <aside class="rail">
    <div class="railhead">
      <input id="search" placeholder="Search items…">
      <div class="chips">
        <button class="chip on" data-f="all">All</button>
        <button class="chip" data-f="untuned">Untuned</button>
        <button class="chip" data-f="members">Members</button>
        <button class="chip" data-f="base">Base</button>
        <button class="chip" data-f="rejected">⚠ Rejected</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="stagewrap">
    <div class="animbar" id="animbar"></div>
    <div class="stage" id="stage"></div>
  </div>

  <aside class="panel" id="panel">
    <div class="empty">Pick an item to tune its placement.</div>
  </aside>
</main>

<!-- PIG MODE -->
<main id="mode-pig" class="hidden" style="flex-direction:column">
  <div class="pigbar">
    <span class="hint" style="font-weight:700;color:#6e5a44">Animation:</span>
    <select id="pig-anim"></select>
    <span class="hint" style="font-weight:700;color:#6e5a44;margin-left:8px">Frame:</span>
    <span class="seg" id="pig-frames"></span>
    <button class="btn ghost" id="pig-onion" style="margin-left:8px">Onion skin: off</button>
    <span style="width:1px;height:22px;background:var(--line);margin:0 6px"></span>
    <button class="btn ghost" id="pig-matchprev" title="Set every anchor in this frame to the previous frame's position">Match ← prev frame</button>
    <button class="btn ghost" id="pig-freeze" title="Set ALL frames of this animation to this frame — nothing moves">Freeze: all frames = this</button>
    <span class="seg" style="margin-left:6px"><button class="btn ghost" id="pig-scaledn" title="Scale all anchors smaller around their center">Scale −</button>
    <button class="btn ghost" id="pig-scaleup" title="Scale all anchors larger around their center">Scale +</button></span>
    <label class="toggle" style="margin-left:6px;font-size:12px"><input type="checkbox" id="pig-pin"> Pin edits to all frames</label>
    <span class="status" id="pig-status"></span>
  </div>
  <div style="flex:1;display:flex;min-height:0">
    <div class="stagewrap">
      <div class="stage" id="pig-stage"></div>
    </div>
    <aside class="panel" style="width:260px">
      <h3>Anchors (this frame)</h3>
      <div class="anchorList" id="pig-anchorlist"></div>
      <div class="hint">Drag a dot to move it. Missing anchors fall back to REST (shown dim) — drag to set one for this frame. <code>eyes</code>/<code>feet</code> are computed midpoints, not editable.</div>
    </aside>
  </div>
</main>

<script>
const ANCHORS=["head","eye_l","eye_r","snout","mouth","neck","body","hand_l","hand_r","leg_l","leg_r"];
const PIG_IMG="/img/assets/images/sprites/rosie/idle_1.png";
const CARD=300, SCALE=1.5, S=CARD*SCALE; // stage px
const $=(s,r=document)=>r.querySelector(s);
let DATA={items:[],rest:{}}, REL={}, SEL=null, FILTER="all", Q="", REJ={};
let aspectCache={};
// Items-mode pose scrubber: preview the selected item across animations/frames
// using the SAME per-frame anchors the app resolves (so you catch placement
// that drifts on walk/jump/wave, not just idle).
let IANIM="idle", IFRAME=0, IPLAY=null, ANIMSCALE={};

// ---- load ----
async function boot(){
  DATA=await fetch("/api/data").then(r=>r.json());
  const an=await fetch("/api/anchors").then(r=>r.json()); FRAMES=an.frames; DATA.rest=an.rest;
  ANIMSCALE=DATA.animScale||{};
  REJ=DATA.rejections||{};
  // Seed the save-map from the FULL hat_rel (every hand-tuned entry, incl. ones
  // whose art isn't under hats/) so a rebuild-all save never drops any.
  REL={}; Object.keys(DATA.hatRel||{}).forEach(id=>{const s=DATA.hatRel[id];REL[id]={pivot:{...s.pivot},widthFrac:s.widthFrac,anchor:s.anchor,behind:!!s.behind};});
  renderList(); drawAnimBar();
  $("#status").innerHTML=`${DATA.items.length} items · <b>${DATA.items.filter(i=>i.tuned).length}</b> tuned · ${DATA.items.filter(i=>!i.tuned).length} untuned`;
  buildPigMode();
  // deep-link: /?item=<id> jumps straight to that item (regen studio hands off here)
  const want=new URLSearchParams(location.search).get("item");
  if(want&&DATA.items.some(i=>i.id===want)) select(want);
}

// Resolve a pig anchor at (anim, frame) — mirrors resolveAnchor in hats.ts:
// per-frame value, REST fallback, eyes/feet = computed L/R midpoints.
function resolveA(anim, frame, name){
  if(name==="eyes"){const l=resolveA(anim,frame,"eye_l"),r=resolveA(anim,frame,"eye_r");return {x:(l.x+r.x)/2,y:(l.y+r.y)/2};}
  if(name==="feet"){const l=resolveA(anim,frame,"leg_l"),r=resolveA(anim,frame,"leg_r");return {x:(l.x+r.x)/2,y:(l.y+r.y)/2};}
  const fr=(FRAMES[anim]&&FRAMES[anim][frame])||{};
  return fr[name]||DATA.rest[name]||{x:150,y:150};
}
function drawAnimBar(){
  const bar=$("#animbar"); if(!bar)return;
  const anims=Object.keys(FRAMES); if(!anims.length){bar.innerHTML="";return;}
  const nf=(FRAMES[IANIM]||[]).length||4;
  bar.innerHTML=`<span class="sub" style="font-weight:700;color:#6e5a44">Pose</span>
    <select id="ianim">${anims.map(a=>`<option ${a===IANIM?'selected':''}>${a}</option>`).join("")}</select>
    ${Array.from({length:nf},(_,i)=>`<button class="fb ${i===IFRAME?'on':''}" data-f="${i}">${i+1}</button>`).join("")}
    <button class="fb" id="iplay" style="min-width:30px">${IPLAY?'❚❚':'▶'}</button>
    <span style="width:1px;height:20px;background:var(--line);margin:0 4px"></span>
    <span class="sub" style="font-weight:700;color:#6e5a44">Scale</span>
    <input type="range" id="iscale" min="0.6" max="1.8" step="0.01" value="${ANIMSCALE[IANIM]||1}" style="width:96px;vertical-align:middle;accent-color:var(--gold)">
    <span class="sub" id="iscaleval" style="min-width:34px">${(ANIMSCALE[IANIM]||1).toFixed(2)}×</span>`;
  $("#ianim").onchange=e=>{IANIM=e.target.value;IFRAME=0;drawAnimBar();drawStage();};
  bar.querySelectorAll(".fb[data-f]").forEach(b=>b.onclick=()=>{stopPlay();IFRAME=+b.dataset.f;drawAnimBar();drawStage();});
  $("#iplay").onclick=togglePlay;
  $("#iscale").oninput=e=>{const v=parseFloat(e.target.value);ANIMSCALE[IANIM]=v;$("#iscaleval").textContent=v.toFixed(2)+"×";drawStage();saveAnimScale();};
}
let scaleT;
function saveAnimScale(){clearTimeout(scaleT);
  scaleT=setTimeout(()=>{fetch("/api/save-anim-scale",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(ANIMSCALE)}).catch(()=>{});},350);}
function stopPlay(){ if(IPLAY){clearInterval(IPLAY);IPLAY=null;} }
function togglePlay(){
  if(IPLAY){stopPlay();drawAnimBar();return;}
  IPLAY=setInterval(()=>{const nf=(FRAMES[IANIM]||[]).length||4;IFRAME=(IFRAME+1)%nf;drawAnimBar();drawStage();},450);
  drawAnimBar();
}

// ---- ITEMS: list ----
function visible(){
  return DATA.items.filter(it=>{
    if(Q && !it.id.includes(Q)) return false;
    if(FILTER==="untuned") return !it.tuned;
    if(FILTER==="members") return it.members;
    if(FILTER==="base") return !it.members;
    if(FILTER==="rejected") return !!REJ[it.id];
    return true;
  });
}
// Categories with no on-pig anatomy placement: full-canvas (aura/background) and
// tickle particles (a burst effect played on tap, never anchored to the pig).
function noPlacement(cat){ return cat==="aura"||cat==="background"||cat==="tickle_particle"; }
function makeRow(it){
  const rej=!!REJ[it.id];
  const r=document.createElement("div"); r.className="row"+(SEL===it.id?" sel":"")+(rej?" rej":"");
  const dot=it.tuned?"tuned":(it.defaulted?"def":"none");
  r.innerHTML=`<div class="th"><img src="/img/${it.image}"></div>
    <div class="meta"><div class="id">${it.id}</div><div class="cat">${rej?'<span class="rejmark">⚠ rejected</span>':(it.category||"—")+(it.members?" · members":"")}</div></div>
    <div class="dot ${dot}" title="${it.tuned?'hand-tuned':it.defaulted?'category default':'no spec'}"></div>`;
  r.onclick=()=>select(it.id);
  return r;
}
function renderList(){
  const list=$("#list"); list.innerHTML="";
  const vis=visible();
  const isParticle=it=>it.category==="tickle_particle";
  // placeable items first, then particles in their own section
  vis.filter(it=>!isParticle(it)).forEach(it=>list.appendChild(makeRow(it)));
  const parts=vis.filter(isParticle);
  if(parts.length){
    const hdr=document.createElement("div");
    hdr.style.cssText="padding:9px 10px 5px;font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut,#9a8c78);border-top:1px solid var(--line,#e7d8c4);margin-top:6px";
    hdr.textContent="Tickle particles · not placed on the pig";
    list.appendChild(hdr);
    parts.forEach(it=>list.appendChild(makeRow(it)));
  }
}
$("#search").oninput=e=>{Q=e.target.value.trim().toLowerCase();renderList();};
document.querySelectorAll(".chip[data-f]").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip[data-f]").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");FILTER=c.dataset.f;renderList();
});

// ---- ITEMS: selection + spec ----
function curSpec(){
  const it=DATA.items.find(i=>i.id===SEL);
  return REL[SEL] || (it&&it.rel) || {pivot:{x:0.5,y:1},widthFrac:0.4,anchor:"head",behind:false};
}
function select(id){
  SEL=id; renderList();
  const it=DATA.items.find(i=>i.id===id);
  const fullCanvas = noPlacement(it.category);
  renderPanel(it,fullCanvas); drawStage(); drawItemCanvas();
}

function renderPanel(it,fullCanvas){
  const s=curSpec();
  $("#panel").innerHTML=`
    <h3>${it.id}</h3>
    <div class="hint">${it.category||"uncategorised"}${it.members?" · members":""} · ${it.tuned?"hand-tuned":it.defaulted?"category default":"no spec yet"}</div>
    ${fullCanvas?`<div class="hint" style="color:var(--red)">${it.category==="tickle_particle"?"Tickle particles are a burst effect played on tap — not placed on the pig. Nothing to tune here.":`${it.category} is full-canvas (rendered behind the pig at 300×300) — it has no pivot/anchor placement. Nothing to tune here.`}</div>`:`
    <h3>Pivot (drag on the item)</h3>
    <div class="itemcanvas" id="itemcanvas"><img src="/img/${it.image}"><div class="pivotMark" id="pivotMark"></div></div>
    <div class="fld"><label>Anchor <span id="anchorName">${s.anchor}</span></label>
      <div class="hint"><b>Drag the item on the pig</b> to move it. Click a blue dot to change which anchor it attaches to.</div></div>
    <div class="fld"><label>Width <span id="wfVal">${s.widthFrac.toFixed(3)}</span></label>
      <input type="range" id="wf" min="0.05" max="1.2" step="0.005" value="${s.widthFrac}"></div>
    <div class="fld"><label>Pivot X <span id="pxVal">${s.pivot.x.toFixed(3)}</span></label>
      <input type="range" id="px" min="-0.3" max="1.3" step="0.005" value="${s.pivot.x}"></div>
    <div class="fld"><label>Pivot Y <span id="pyVal">${s.pivot.y.toFixed(3)}</span></label>
      <input type="range" id="py" min="-0.3" max="1.3" step="0.005" value="${s.pivot.y}"></div>
    <label class="toggle"><input type="checkbox" id="behind" ${s.behind?"checked":""}> Render behind pig</label>
    <button class="btn ghost" id="resetDefault">Reset to category default</button>
    <button class="btn primary" id="nextUntuned">Next untuned →</button>
    <div class="hint" id="saveHint">Saved automatically to hat_rel.generated.ts.</div>
    `}
    <div class="rejbox">
      <label class="toggle"><input type="checkbox" id="rejToggle" ${REJ[SEL]?"checked":""}> ⚠ Reject this item's art</label>
      <div class="hint">Flag bad / off-style art for regeneration — your reason is recorded (docs/art-rejections.json) for the next generation.</div>
      <textarea id="rejReason" placeholder="Why reject the art? (wrong style, off-palette, can't sit on the pig…)" style="${REJ[SEL]?"":"display:none"}">${((REJ[SEL]&&REJ[SEL].reason)||"").replace(/</g,"&lt;")}</textarea>
    </div>`;
  // Reject handlers — work for EVERY item (incl. full-canvas aura/background art).
  const rt=$("#rejToggle"), rr=$("#rejReason");
  if(rt){
    rt.onchange=()=>{
      if(rt.checked){REJ[SEL]={reason:(REJ[SEL]&&REJ[SEL].reason)||""};rr.style.display="";rr.focus();saveReject(false);}
      else{delete REJ[SEL];rr.style.display="none";saveReject(true);}
      renderList();
    };
    let rrt; rr.oninput=()=>{if(!REJ[SEL])REJ[SEL]={reason:""};REJ[SEL].reason=rr.value;clearTimeout(rrt);rrt=setTimeout(()=>saveReject(false),400);};
  }
  if(fullCanvas) return;
  const bind=(id,key,sub)=>{const el=$("#"+id);el.oninput=()=>{
    const v=parseFloat(el.value); const sp=ensureRel();
    if(sub){sp.pivot[sub]=v;}else{sp[key]=v;}
    $("#"+id+"Val")&&($("#"+(key==='widthFrac'?'wf':key)+"Val").textContent=v.toFixed(3));
    drawStage(); drawItemCanvas(); save();
  };};
  $("#wf").oninput=()=>{ensureRel().widthFrac=parseFloat($("#wf").value);$("#wfVal").textContent=parseFloat($("#wf").value).toFixed(3);drawStage();drawItemCanvas();save();};
  $("#px").oninput=()=>{ensureRel().pivot.x=parseFloat($("#px").value);$("#pxVal").textContent=parseFloat($("#px").value).toFixed(3);drawStage();drawItemCanvas();save();};
  $("#py").oninput=()=>{ensureRel().pivot.y=parseFloat($("#py").value);$("#pyVal").textContent=parseFloat($("#py").value).toFixed(3);drawStage();drawItemCanvas();save();};
  $("#behind").onchange=()=>{ensureRel().behind=$("#behind").checked;drawStage();save();};
  $("#resetDefault").onclick=()=>{const it=DATA.items.find(i=>i.id===SEL);if(it&&it.rel){REL[SEL]={...it.rel,pivot:{...it.rel.pivot}};select(SEL);save();}};
  $("#nextUntuned").onclick=()=>{const u=visible().find(i=>!i.tuned&&i.id!==SEL)||DATA.items.find(i=>!i.tuned);if(u)select(u.id);};
  setupItemCanvasDrag();
}
function ensureRel(){ if(!REL[SEL]){const s=curSpec();REL[SEL]={pivot:{...s.pivot},widthFrac:s.widthFrac,anchor:s.anchor,behind:!!s.behind};} return REL[SEL]; }

// item-aspect (natural h/w), cached
function itemAspect(src){return new Promise(res=>{if(aspectCache[src])return res(aspectCache[src]);const im=new Image();im.onload=()=>{aspectCache[src]=im.naturalHeight/im.naturalWidth||1;res(aspectCache[src]);};im.onerror=()=>res(1);im.src=src;});}

async function drawStage(){
  const it=DATA.items.find(i=>i.id===SEL); if(!it)return;
  const st=$("#stage"); st.style.width=S+"px"; st.style.height=S+"px";
  const fullCanvas=noPlacement(it.category);
  const s=curSpec();
  const src="/img/"+it.image, aspect=await itemAspect(src);
  const w=s.widthFrac*CARD, h=w*aspect;
  const a=resolveA(IANIM,IFRAME,s.anchor);              // per-frame anchor (idle/walk/jump/…)
  const left=a.x - s.pivot.x*w, top=a.y - s.pivot.y*h;
  const behind=!!s.behind;
  let html=`<div class="pig" style="z-index:${behind?20:5}"><img src="${pigFrameImg(IANIM,IFRAME)}"></div>`;
  if(!fullCanvas){
    html+=`<div class="item" style="z-index:${behind?2:10};left:${left*SCALE}px;top:${top*SCALE}px;width:${w*SCALE}px;height:${h*SCALE}px"><img src="${src}" draggable="false"></div>`;
  }else{
    html+=`<div class="item" style="z-index:2;left:0;top:0;width:${S}px;height:${S}px"><img src="${src}" style="object-fit:cover"></div>`;
  }
  // anchor dots (move with the pose so you see exactly what the item tracks)
  if(!fullCanvas){
    ANCHORS.concat(["eyes","feet"]).forEach(name=>{
      const an=resolveA(IANIM,IFRAME,name); if(!an)return;
      const on=name===s.anchor;
      html+=`<div class="anchorDot ${on?'on':''}" data-anchor="${name}" style="left:${an.x*SCALE}px;top:${an.y*SCALE}px"><span class="lbl">${name}</span></div>`;
    });
  }
  // Apply the per-animation render scale as a card transform — pig + item + dots
  // scale together around centre, exactly like the in-app pig card. This is what
  // makes every pose read at the same size as idle.
  const k=ANIMSCALE[IANIM]||1;
  st.innerHTML=`<div style="position:absolute;inset:0;transform:scale(${k});transform-origin:50% 50%">${html}</div>`;
  st.querySelectorAll(".anchorDot").forEach(d=>d.onclick=()=>{ensureRel().anchor=d.dataset.anchor;$("#anchorName")&&($("#anchorName").textContent=d.dataset.anchor);drawStage();save();});
  // Drag the item directly on the pig to move it (adjusts the pivot live).
  if(!fullCanvas){
    const el=st.querySelector(".item");
    if(el){
      el.style.cursor="grab";
      let drag=false,lx=0,ly=0;
      el.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);el.style.cursor="grabbing";e.preventDefault();};
      el.onpointermove=e=>{ if(!drag)return;
        const sp=ensureRel();
        sp.pivot.x-=((e.clientX-lx)/(SCALE*k))/w;
        sp.pivot.y-=((e.clientY-ly)/(SCALE*k))/h;
        lx=e.clientX; ly=e.clientY;
        el.style.left=((a.x-sp.pivot.x*w)*SCALE)+"px";
        el.style.top =((a.y-sp.pivot.y*h)*SCALE)+"px";
        const px=$("#px"),py=$("#py");
        if(px){px.value=sp.pivot.x;$("#pxVal").textContent=sp.pivot.x.toFixed(3);}
        if(py){py.value=sp.pivot.y;$("#pyVal").textContent=sp.pivot.y.toFixed(3);}
      };
      const end=()=>{ if(!drag)return; drag=false; el.style.cursor="grab"; drawItemCanvas(); save(); };
      el.onpointerup=end; el.onpointercancel=end;
    }
  }
}

function drawItemCanvas(){
  const mark=$("#pivotMark"), cv=$("#itemcanvas"); if(!mark||!cv)return;
  const s=curSpec();
  mark.style.left=(s.pivot.x*cv.clientWidth)+"px";
  mark.style.top=(s.pivot.y*cv.clientHeight)+"px";
}
function setupItemCanvasDrag(){
  const cv=$("#itemcanvas"); if(!cv)return;
  let drag=false;
  const set=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    const sp=ensureRel();sp.pivot.x=Math.max(-0.3,Math.min(1.3,x));sp.pivot.y=Math.max(-0.3,Math.min(1.3,y));
    $("#px").value=sp.pivot.x;$("#py").value=sp.pivot.y;$("#pxVal").textContent=sp.pivot.x.toFixed(3);$("#pyVal").textContent=sp.pivot.y.toFixed(3);
    drawItemCanvas();drawStage();save();};
  cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);set(e);};
  cv.onpointermove=e=>{if(drag)set(e);};
  cv.onpointerup=()=>{drag=false;};
}

// ---- save (rebuild-all) ----
let saveT;
function save(){
  // mark current item tuned in the list immediately
  const it=DATA.items.find(i=>i.id===SEL); if(it&&!it.tuned){it.tuned=true;renderList();}
  clearTimeout(saveT);
  $("#status").innerHTML=`saving…`;
  saveT=setTimeout(async()=>{
    const r=await fetch("/api/save-rel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(REL)}).then(r=>r.json()).catch(()=>null);
    $("#status").innerHTML=r&&r.ok?`<b>saved</b> · ${r.count} item specs in hat_rel.generated.ts`:`save failed`;
  },350);
}
// Persist an art rejection (+ reason) to docs/art-rejections.json — the durable
// record the generation pipeline reads. clear=true un-rejects.
function saveReject(clear){
  const body=clear?{id:SEL,clear:true}:{id:SEL,reason:(REJ[SEL]&&REJ[SEL].reason)||""};
  fetch("/api/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(r=>r.json()).then(r=>{$("#status").innerHTML=`<b>${clear?"un-rejected":"rejected"}</b> · ${r.count} flagged in art-rejections.json`;}).catch(()=>{});
}

// ---- mode switch ----
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");
  const m=t.dataset.m;
  $("#mode-items").classList.toggle("hidden",m!=="items");
  $("#mode-pig").classList.toggle("hidden",m!=="pig");
});

// ============ PIG ANATOMY MODE ============
let FRAMES={}, PANIM="idle", PFRAME=0, ONION=false, PIN_ALL=false;
const clone=o=>JSON.parse(JSON.stringify(o));
async function buildPigMode(){
  const d=await fetch("/api/anchors").then(r=>r.json());
  FRAMES=d.frames; DATA.rest=d.rest;
  const sel=$("#pig-anim"); sel.innerHTML=Object.keys(FRAMES).map(a=>`<option>${a}</option>`).join("");
  sel.onchange=()=>{PANIM=sel.value;PFRAME=0;drawPig();};
  $("#pig-onion").onclick=()=>{ONION=!ONION;$("#pig-onion").textContent="Onion skin: "+(ONION?"on":"off");drawPig();};
  $("#pig-pin").onchange=e=>{PIN_ALL=e.target.checked;};
  $("#pig-scaledn").onclick=()=>scaleFrame(0.97);
  $("#pig-scaleup").onclick=()=>scaleFrame(1.03);
  // Match this frame to the previous one (every anchor) — for poses that
  // shouldn't move between frames.
  $("#pig-matchprev").onclick=()=>{
    const f=FRAMES[PANIM]; if(!f||f.length<2)return;
    f[PFRAME]=clone(f[(PFRAME-1+f.length)%f.length]); drawPig(); savePig();
  };
  // Freeze the whole animation: every frame = the current frame (nothing moves).
  $("#pig-freeze").onclick=()=>{
    const f=FRAMES[PANIM]; if(!f)return;
    const cur=clone(f[PFRAME]); for(let i=0;i<f.length;i++) f[i]=clone(cur);
    drawPig(); savePig();
  };
  drawPig();
}
function pigFrameImg(anim,frame){return `/img/assets/images/sprites/rosie/${anim}_${frame+1}.png`;}
// Scale every anchor of the current frame around their centroid (or all frames
// when Pin is on). Missing anchors are materialised from REST first so the
// whole cluster scales together.
function scaleFrame(factor){
  const apply=(fr)=>{
    ANCHORS.forEach(n=>{ if(!fr[n]) fr[n]={...(DATA.rest[n]||{x:150,y:150})}; });
    const cx=ANCHORS.reduce((s,n)=>s+fr[n].x,0)/ANCHORS.length;
    const cy=ANCHORS.reduce((s,n)=>s+fr[n].y,0)/ANCHORS.length;
    ANCHORS.forEach(n=>{ fr[n]={x:Math.round(cx+(fr[n].x-cx)*factor), y:Math.round(cy+(fr[n].y-cy)*factor)}; });
  };
  if(PIN_ALL) FRAMES[PANIM].forEach(apply); else apply(FRAMES[PANIM][PFRAME]);
  drawPig(); savePig();
}
function resolvePig(name){ // frame value or REST fallback
  const fr=FRAMES[PANIM]&&FRAMES[PANIM][PFRAME]||{};
  if(name in fr) return {...fr[name],set:true};
  if(DATA.rest[name]) return {...DATA.rest[name],set:false};
  return null;
}
function drawPig(){
  const frames=FRAMES[PANIM]||[];
  $("#pig-frames").innerHTML=frames.map((_,i)=>`<button class="tab ${i===PFRAME?'on':''}" data-fr="${i}">${i}</button>`).join("");
  $("#pig-frames").querySelectorAll("button").forEach(b=>b.onclick=()=>{PFRAME=+b.dataset.fr;drawPig();});
  const st=$("#pig-stage"); st.style.width=S+"px"; st.style.height=S+"px";
  let html=`<div class="pig"><img src="${pigFrameImg(PANIM,PFRAME)}"></div>`;
  if(ONION&&PFRAME>0) html=`<div class="pig" style="opacity:.3"><img src="${pigFrameImg(PANIM,PFRAME-1)}"></div>`+html;
  ANCHORS.forEach(name=>{
    const a=resolvePig(name); if(!a)return;
    html+=`<div class="dragDot" data-a="${name}" style="left:${a.x*SCALE}px;top:${a.y*SCALE}px;opacity:${a.set?1:.4};background:${a.set?'var(--green)':'#b9a98f'}"><span class="lbl">${name}</span></div>`;
  });
  st.innerHTML=html;
  st.querySelectorAll(".dragDot").forEach(setupDotDrag);
  // anchor list — each row has a "⇉ all" to sync THAT anchor across every frame
  $("#pig-anchorlist").innerHTML=ANCHORS.map(n=>{const a=resolvePig(n);const miss=!a||!a.set;
    return `<div class="ar ${miss?'miss':''}"><span>${n}</span><span>${a?Math.round(a.x)+", "+Math.round(a.y):"—"}${miss?" (rest)":""} <button class="syncbtn" data-sync="${n}" title="Set ${n} in ALL frames of ${PANIM} to this frame's value">⇉ all</button></span></div>`;}).join("");
  $("#pig-anchorlist").querySelectorAll(".syncbtn").forEach(b=>b.onclick=()=>syncAnchorAcrossFrames(b.dataset.sync));
}
// Sync ONE anchor across all frames of the current animation to the current
// frame's value (e.g. make every "head" match this frame) — leaves the rest.
function syncAnchorAcrossFrames(name){
  const f=FRAMES[PANIM]; if(!f)return;
  const cur=resolvePig(name); if(!cur)return;
  const val={x:cur.x,y:cur.y};
  f.forEach(fr=>fr[name]={...val});
  drawPig(); savePig();
}
function setupDotDrag(dot){
  const st=$("#pig-stage"); let drag=false;
  const move=e=>{ if(!drag)return;
    const r=st.getBoundingClientRect();
    const x=Math.max(0,Math.min(CARD,(e.clientX-r.left)/SCALE));
    const y=Math.max(0,Math.min(CARD,(e.clientY-r.top)/SCALE));
    const pos={x,y};
    // PIN_ALL: this anchor shouldn't move across the animation — write it to
    // every frame at once. Otherwise just the current frame.
    if(PIN_ALL) FRAMES[PANIM].forEach(fr=>fr[dot.dataset.a]={...pos});
    else FRAMES[PANIM][PFRAME][dot.dataset.a]=pos;
    // Move the dot LIVE (no full redraw) so the element + its pointer capture
    // survive the drag — redrawing here destroyed the dot mid-drag, which is
    // why it jumped once then "selected" whatever was under the cursor.
    dot.style.left=(x*SCALE)+"px"; dot.style.top=(y*SCALE)+"px";
    dot.style.opacity=1; dot.style.background="var(--green)";
    savePig();};
  dot.onpointerdown=e=>{drag=true;dot.setPointerCapture(e.pointerId);dot.style.cursor="grabbing";e.preventDefault();e.stopPropagation();};
  dot.onpointermove=move;
  dot.onpointerup=e=>{drag=false;try{dot.releasePointerCapture(e.pointerId);}catch(_){}drawPig();};
  dot.onpointercancel=()=>{drag=false;drawPig();};
}
let pigT;
function savePig(){clearTimeout(pigT);$("#pig-status").textContent="saving…";
  pigT=setTimeout(async()=>{const r=await fetch("/api/save-anchors",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(FRAMES)}).then(r=>r.json()).catch(()=>null);
    $("#pig-status").innerHTML=r&&r.ok?"<b>saved</b> to PIG_FRAME_ANCHORS":"save failed";},400);}

boot();
</script>
